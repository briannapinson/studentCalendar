<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes | Student Calendar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="#main" class="skip-link">Skip to main content</a>

  <header>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="calendar.html">Calendar</a></li>
        <li><a href="todo.html">To-Do</a></li>
        <li><a href="notes.html" aria-current="page">Notes</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <h1>Notes</h1>

    <section id="note-tools" aria-label="Filter and search notes">
      <p>Filters:</p>
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="IST 4654" aria-pressed="false">IST 4654</button>
      <button type="button" data-filter="Personal" aria-pressed="false">Personal</button>

      
      <input type="search" id="search" placeholder="Search...">

      <a href="newNote.html">+ New Note</a>
    </section>

    <section id="notes-list" aria-label="Saved notes"></section>
    <p id="notes-empty" hidden>No notes found.</p>

    <div id="note-view" popover>
      <h2 id="note-view-title"></h2>
      <p class="course" id="note-view-course"></p>
      <p id="note-view-body"></p>
      <div>
        <a id="note-view-edit" href="newNote.html">Edit</a>
        <button type="button" id="note-view-delete">Delete</button>
        <button type="button" popovertarget="note-view" popovertargetaction="hide">Close</button>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Student Calendar | Last Updated: 11/17/2026 | Contact: <a href="mailto:blph3y@umsystem.edu">blph3y@umsystem.edu</a></p>
  </footer>

  <script src="notes.js"></script>
</body>
</html>
