<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Note | Student Calendar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="#main" class="skip-link">Skip to main content</a>

  <header>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="calendar.html">Calendar</a></li>
        <li><a href="todo.html">To-Do</a></li>
        <li><a href="notes.html" aria-current="page">Notes</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <h1 id="form-title">New Note</h1>
    <p><a href="notes.html">Back to Notes</a></p>

    <form id="note-form">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" required>

      <label for="course">Category</label>
      <select id="course" name="course">
        <option>Work</option>
        <option>School</option>
        <option>Personal</option>
      </select>

      <label for="body">Note</label>
      <textarea id="body" name="body" rows="8"></textarea>

      <div>
        <button type="submit" id="save-note">Save Note</button>
        <a href="notes.html">Cancel</a>
      </div>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Student Calendar | Last Updated: 11/17/2026 | Contact: <a href="mailto:blph3y@umsystem.edu">blph3y@umsystem.edu</a></p>
  </footer>

  <script src="newNote.js"></script>
</body>
</html>
