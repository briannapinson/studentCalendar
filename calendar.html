<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar | Student Calendar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="#main" class="skip-link">Skip to main content</a>

  <header>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="calendar.html" aria-current="page">Calendar</a></li>
        <li><a href="todo.html">To-Do</a></li>
        <li><a href="notes.html">Notes</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <h1>Calendar</h1>

    <section id="calendar-tools" aria-label="Calendar controls">
      <div class="month-nav">
        <button type="button" id="prev-month" aria-label="Previous month">&lt;</button>
        <h2 id="month-title"></h2>
        <button type="button" id="next-month" aria-label="Next month">&gt;</button>
      </div>

      <button type="button" class="new-event" popovertarget="event-popup">+ New Event</button>
    </section>

    <section aria-label="Month view">
      <table id="calendar">
        <caption id="calendar-caption" class="visually-hidden"></caption>
        <thead>
          <tr>
            <th scope="col">Sun</th>
            <th scope="col">Mon</th>
            <th scope="col">Tue</th>
            <th scope="col">Wed</th>
            <th scope="col">Thu</th>
            <th scope="col">Fri</th>
            <th scope="col">Sat</th>
          </tr>
        </thead>
        <tbody id="calendar-body"></tbody>
      </table>
    </section>

    <section id="upcoming" aria-labelledby="upcoming-heading">
      <h2 id="upcoming-heading">Upcoming</h2>
      <ul id="upcoming-list"></ul>
    </section>

    <div id="event-popup" popover>
      <form id="event-form">
        <h2 id="event-popup-title">New Event</h2>

        <label for="event-name">Name</label>
        <input type="text" id="event-name" name="name" required>

        <label for="event-priority">Priority</label>
        <select id="event-priority" name="priority">
          <option>Low</option>
          <option selected>Medium</option>
          <option>High</option>
        </select>

        <label for="event-date">Date</label>
        <input type="date" id="event-date" name="date" required>

        <label for="event-location">Location</label>
        <input type="text" id="event-location" name="location">

        <label for="event-description">Description</label>
        <textarea id="event-description" name="description" rows="5"></textarea>

        <div>
          <button type="submit" id="save-event">Save</button>
          <button type="button" id="delete-event" hidden>Delete</button>
          <button type="button" popovertarget="event-popup" popovertargetaction="hide">Close</button>
        </div>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Student Calendar | Last Updated: 11/17/2026 | Contact: <a href="mailto:blph3y@umsystem.edu">blph3y@umsystem.edu</a></p>
  </footer>

  <script src="calendar.js"></script>
</body>
</html>
