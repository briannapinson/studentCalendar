<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List | Student Calendar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="calendar.html">Calendar</a></li>
        <li><a href="todo.html">To-Do</a></li>
        <li><a href="notes.html">Notes</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>To-Do List</h1>

    <!-- Month and Year Dropdowns -->
    <section>
      <label for="month">Month:</label>
      <select id="month" name="month">
        <option value="January">January</option>
        <option value="February">February</option>
        <option value="March">March</option>
        <option value="April">April</option>
        <option value="May">May</option>
        <option value="June">June</option>
        <option value="July">July</option>
        <option value="August">August</option>
        <option value="September">September</option>
        <option value="October">October</option>
        <option value="November" selected>November</option>
        <option value="December">December</option>
      </select>

      <label for="year">Year:</label>
      <select id="year" name="year">
        <option value="2026" selected>2026</option>
        <option value="2027">2027</option>
        <option value="2028">2028</option>
        <option value="2029">2029</option>
        <option value="2030">2030</option>
      </select>
    </section>

<p>Currently, filtering is not possible due to html restrictions.</p>

    <!-- Main Task List -->
    <section>
      <h2>My Tasks</h2>

      <ul>
        <li>
          <input type="checkbox" id="task1">
          <label for="task1">Complete Chapter 1 Reading</label>
        </li>

        <li>
          <input type="checkbox" id="task2">
          <label for="task2">Submit Homework Assignment</label>
        </li>

        <li>
          <input type="checkbox" id="task3">
          <label for="task3">Study for Upcoming Quiz</label>
        </li>

        <li>
          <input type="checkbox" id="task4">
          <label for="task4">Complete Group Project</label>
        </li>

        <li>
          <input type="checkbox" id="task5">
          <label for="task5">Review Lecture Notes</label>
        </li>

        <li>
          <input type="checkbox" id="task6">
          <label for="task6">Prepare for Final Exam</label>
        </li>
      </ul>
    </section>
	
	<p>Currently, checkboxes do not save due to html restrictions.</p>	

  </main>

  <footer>
      <p>&copy; 2026 Student Calendar | Last Updated: 11/17/2026 | Contact: <a href="mailto:blph3y@umsystem.edu">blph3y@umsystem.edu</a></p>
  </footer>

</body>
</html>
