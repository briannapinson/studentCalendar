<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List | Student Calendar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="#main" class="skip-link">Skip to main content</a>

  <header>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="calendar.html">Calendar</a></li>
        <li><a href="todo.html" aria-current="page">To-Do</a></li>
        <li><a href="notes.html">Notes</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <h1>To-Do List</h1>

    <section id="todo-tools" aria-label="Filter tasks">
      <div class="tools-group">
        <label for="month">Month:</label>
        <select id="month" name="month">
          <option value="all" selected>All months</option>
          <option value="0">January</option>
          <option value="1">February</option>
          <option value="2">March</option>
          <option value="3">April</option>
          <option value="4">May</option>
          <option value="5">June</option>
          <option value="6">July</option>
          <option value="7">August</option>
          <option value="8">September</option>
          <option value="9">October</option>
          <option value="10">November</option>
          <option value="11">December</option>
        </select>

        <label for="year">Year:</label>
        <select id="year" name="year">
          <option value="all" selected>All years</option>
          <option value="2026">2026</option>
          <option value="2027">2027</option>
          <option value="2028">2028</option>
          <option value="2029">2029</option>
          <option value="2030">2030</option>
        </select>
      </div>

      <div class="tools-group">
        <label for="status">Show:</label>
        <select id="status" name="status">
          <option value="all" selected>All tasks</option>
          <option value="active">Active</option>
          <option value="done">Done</option>
        </select>
      </div>
    </section>

    <section id="todo-section" aria-labelledby="todo-heading">
      <h2 id="todo-heading">My Tasks</h2>
      <p id="todo-count"></p>
      <ul id="todo-list"></ul>
      <p id="todo-empty" hidden>No tasks to show.</p>

      <form id="todo-form" aria-label="Add a task">
        <div class="field field-wide">
          <label for="task-name">New task</label>
          <input type="text" id="task-name" name="task" required>
        </div>

        <div class="field">
          <label for="task-due">Due date</label>
          <input type="date" id="task-due" name="due">
        </div>

        <div class="field">
          <label for="task-priority">Priority</label>
          <select id="task-priority" name="priority">
            <option>Low</option>
            <option selected>Medium</option>
            <option>High</option>
          </select>
        </div>

        <button type="submit">Add Task</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Student Calendar | Last Updated: 11/17/2026 | Contact: <a href="mailto:blph3y@umsystem.edu">blph3y@umsystem.edu</a></p>
  </footer>

  <script src="todo.js"></script>
</body>
</html>
